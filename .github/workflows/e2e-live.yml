name: E2E against the live demo

# Runs the Playwright suite against https://jfredmc.github.io/credit-lens/ after
# every Pages deploy (and on demand).
on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Pages to serve the new build
        run: sleep 30
      - run: pnpm e2e
        env:
          E2E_BASE_URL: https://jfredmc.github.io/credit-lens/
